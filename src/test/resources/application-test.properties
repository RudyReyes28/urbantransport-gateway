server.port=0

# Timeouts cortos: un fallo no debe colgar la suite
spring.cloud.gateway.server.webflux.httpclient.connect-timeout=500
spring.cloud.gateway.server.webflux.httpclient.response-timeout=2s

# Permite probar la rotación de llave sin esperar 30 s entre recargas
gateway.security.public-key-min-refresh-interval=0s