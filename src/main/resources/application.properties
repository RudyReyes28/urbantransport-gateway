spring.application.name=api-gateway
server.port=${SERVER_PORT:8080}

# ---------------------------------------------------------------------------
# Microservicios. Cada entrada genera /api/{nombre}/** y /docs/{nombre}/v3/api-docs
# "identity" es obligatorio: de ahi se descarga la llave publica del JWT.
# ---------------------------------------------------------------------------
gateway.services.identity=${IDENTITY_SERVICE_URL:http://localhost:8081}
gateway.services.fleet=${FLEET_SERVICE_URL:http://localhost:8082}
gateway.services.trip=${TRIP_SERVICE_URL:http://localhost:8083}
gateway.services.ticketing=${TICKETING_SERVICE_URL:http://localhost:8084}
gateway.services.customer=${CUSTOMER_SERVICE_URL:http://localhost:8085}
gateway.services.rental=${RENTAL_SERVICE_URL:http://localhost:8086}
gateway.services.finance=${FINANCE_SERVICE_URL:http://localhost:8087}
gateway.services.reporting=${REPORTING_SERVICE_URL:http://localhost:8088}

# ---------------------------------------------------------------------------
# Seguridad JWT (RS256)
# ---------------------------------------------------------------------------
gateway.security.public-key-endpoint=/auth/public-key
gateway.security.public-key-ttl=1h
gateway.security.public-key-min-refresh-interval=30s
gateway.security.allowed-roles=SYSTEM_ADMIN,BRANCH_ADMIN,CASHIER,DRIVER,CUSTOMER

# Nunca se exponen por el gateway (llamadas internas entre microservicios)
gateway.security.blocked-paths[0]=/api/*/internal/**

# Rutas que no requieren token. Method "*" = cualquier metodo
gateway.security.public-routes[0].method=POST
gateway.security.public-routes[0].path=/api/identity/auth/login
gateway.security.public-routes[1].method=POST
gateway.security.public-routes[1].path=/api/identity/auth/refresh
gateway.security.public-routes[2].method=POST
gateway.security.public-routes[2].path=/api/customer/customers/register
# Consulta de viajes y asientos disponibles sin iniciar sesion
gateway.security.public-routes[3].method=GET
gateway.security.public-routes[3].path=/api/ticketing/trips/available
gateway.security.public-routes[4].method=GET
gateway.security.public-routes[4].path=/api/ticketing/trips/*/seats
# OpenAPI de cada servicio, para el Swagger agregado
gateway.security.public-routes[5].method=GET
gateway.security.public-routes[5].path=/docs/*/v3/api-docs

# ---------------------------------------------------------------------------
# CORS para la SPA de Angular
# ---------------------------------------------------------------------------
# Con Spring Cloud Gateway 5 las propiedades del gateway reactivo viven bajo spring.cloud.gateway.server.webflux.*
spring.cloud.gateway.server.webflux.globalcors.cors-configurations.[/**].allowed-origins=${CORS_ALLOWED_ORIGINS:http://localhost:4200}
spring.cloud.gateway.server.webflux.globalcors.cors-configurations.[/**].allowed-methods=GET,POST,PUT,PATCH,DELETE,OPTIONS
spring.cloud.gateway.server.webflux.globalcors.cors-configurations.[/**].allowed-headers=*
spring.cloud.gateway.server.webflux.globalcors.cors-configurations.[/**].max-age=3600
# Evita cabeceras CORS duplicadas si algun microservicio tambienn las agrega
spring.cloud.gateway.server.webflux.default-filters[0]=DedupeResponseHeader=Access-Control-Allow-Origin Access-Control-Allow-Credentials, RETAIN_FIRST

# Timeouts hacia los microservicios
spring.cloud.gateway.server.webflux.httpclient.connect-timeout=3000
spring.cloud.gateway.server.webflux.httpclient.response-timeout=30s

# ---------------------------------------------------------------------------
# Swagger UI agregado: http://localhost:8080/swagger-ui.html
# ---------------------------------------------------------------------------
springdoc.swagger-ui.path=/swagger-ui.html
springdoc.swagger-ui.urls[0].name=identity
springdoc.swagger-ui.urls[0].url=/docs/identity/v3/api-docs
springdoc.swagger-ui.urls[1].name=fleet
springdoc.swagger-ui.urls[1].url=/docs/fleet/v3/api-docs
springdoc.swagger-ui.urls[2].name=trip
springdoc.swagger-ui.urls[2].url=/docs/trip/v3/api-docs
springdoc.swagger-ui.urls[3].name=ticketing
springdoc.swagger-ui.urls[3].url=/docs/ticketing/v3/api-docs
springdoc.swagger-ui.urls[4].name=customer
springdoc.swagger-ui.urls[4].url=/docs/customer/v3/api-docs
springdoc.swagger-ui.urls[5].name=rental
springdoc.swagger-ui.urls[5].url=/docs/rental/v3/api-docs
springdoc.swagger-ui.urls[6].name=finance
springdoc.swagger-ui.urls[6].url=/docs/finance/v3/api-docs
springdoc.swagger-ui.urls[7].name=reporting
springdoc.swagger-ui.urls[7].url=/docs/reporting/v3/api-docs

# ---------------------------------------------------------------------------
# Actuator
# ---------------------------------------------------------------------------
management.endpoints.web.exposure.include=health,info
